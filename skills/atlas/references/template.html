<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Atlas</title>
<!--
  Coeus atlas render shell v1.0.0 — self-contained by contract.
  No external scripts, stylesheets, fonts, images, or network fetches of any
  kind — inline CSS and JS only, so the Phase-3 containment grep stays clean.
  The generator copies this file and replaces the marked injection point below

-->
<style>
:root{
  --bg:#ffffff; --fg:#1a1c22; --mut:#5c6270; --acc:#b07d00; --card:#f4f5f8;
  --bd:#d8dbe3; --code:#eef0f4; --dim:0.18; --pin-parent:#1f6fd0; --pin-child:#d1651a;
  --shadow:0 1px 2px rgba(0,0,0,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1116; --fg:#e6e7ea; --mut:#9aa0a6; --acc:#f4b400; --card:#161922;
    --bd:#262a36; --code:#0b0d12; --dim:0.16; --pin-parent:#7cb1ff; --pin-child:#ff9e5e;
    --shadow:0 1px 2px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--acc)}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);
  border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--acc)}
#err{display:none;padding:10px 16px;background:#7a1420;color:#fff;font-size:14px}
#err.show{display:block}
noscript div{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--bd)}

/* ---------- header strip ---------- */
header{padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
header h1{margin:0 0 4px;font-size:19px;letter-spacing:.2px}
header p{margin:0;color:var(--mut);font-size:14px;max-width:110ch}
header .meta{margin-top:6px;font-size:12px;color:var(--mut)}
header .tools{float:right;display:flex;gap:6px;align-items:center}
header .tools input{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--bd);
  border-radius:6px;background:var(--bg);color:var(--fg);width:190px}

/* ---------- 4 fixed regions ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  grid-template-rows:auto minmax(360px,1fr);gap:12px;padding:12px;
  grid-template-areas:"frame now" "map story"}
#frame{grid-area:frame}#now{grid-area:now}#map{grid-area:map}#story{grid-area:story}
@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr);
    grid-template-areas:"frame" "now" "map" "story"}
}
section.region{border:1px solid var(--bd);border-radius:10px;background:var(--card);
  display:flex;flex-direction:column;min-width:0;overflow:hidden}
section.region>h2{margin:0;padding:8px 12px;font-size:13px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--bd);
  display:flex;justify-content:space-between;align-items:center;gap:8px}
section.region>.body{padding:10px 12px;overflow:auto;min-height:0}
#map>.body{padding:0;position:relative}
h3{margin:12px 0 5px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
h3:first-child{margin-top:0}
ul{margin:0;padding-left:18px}li{margin:2px 0}
.muted{color:var(--mut)}
.empty{color:var(--mut);font-style:italic}

/* ---------- cards / disclosure (R15: summarised always, detail expands) ---------- */
details.card{border:1px solid var(--bd);border-radius:8px;background:var(--bg);
  margin:6px 0;box-shadow:var(--shadow)}
details.card>summary{padding:7px 10px;cursor:pointer;list-style:none;display:block}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";float:right;color:var(--mut)}
details.card[open]>summary::after{content:"\2212"}
details.card>.detail{padding:0 10px 9px;font-size:14px;border-top:1px solid var(--bd);margin-top:2px;padding-top:8px}
.hit{outline:2px solid var(--acc);outline-offset:1px}
@keyframes flashbg{0%{background:var(--acc)}100%{background:transparent}}
.flash{animation:flashbg 1.1s ease-out}

/* ---------- badges ---------- */
.badge{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--bd);background:var(--code);color:var(--mut);margin:0 4px 3px 0;
  cursor:pointer;line-height:1.5}
.badge.guard{border-style:dashed;border-color:var(--acc);color:var(--fg)}
.badge.type{cursor:default;border-style:solid}
.badge.type.fork{border-left:3px solid var(--fg)}
.badge.type.failure{border-bottom:2px solid var(--fg)}
.badge.type.decision{border-top:2px solid var(--fg)}
.badge.delta{border-style:double;border-width:3px;color:var(--fg);cursor:default}

/* ---------- story ---------- */
ol.beats{list-style:none;margin:0;padding:0}
ol.beats>li{position:relative;padding-left:18px;margin:0 0 8px}
ol.beats>li::before{content:"";position:absolute;left:5px;top:6px;width:7px;height:7px;
  border-radius:50%;background:var(--fg)}
ol.beats>li::after{content:"";position:absolute;left:8px;top:16px;bottom:-8px;width:1px;
  background:var(--bd)}
ol.beats>li:last-child::after{display:none}
ol.beats>li.branch{margin-left:20px;border-left:1px dashed var(--bd);padding-left:20px}
ol.beats>li.branch::before{border-radius:0}
.chain{font-size:13.5px}
.chain b{font-weight:600}
.chain .arrow{color:var(--mut);padding:0 3px}
.beatdate{font-size:12px;color:var(--mut);float:right}

/* ---------- map svg ---------- */
#svgwrap{width:100%;height:100%;min-height:340px;overflow:hidden;cursor:grab;background:var(--bg)}
#svgwrap.drag{cursor:grabbing}
svg{width:100%;height:100%;display:block;touch-action:none}
.grp-box{fill:none;stroke:var(--bd);stroke-width:1;stroke-dasharray:5 4;rx:10}
.grp-label{fill:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
g.node rect.box{stroke-width:1.6;transition:none}
g.node text.lbl{font-size:12.5px;font-weight:600;fill:var(--fg)}
g.node text.kind{font-size:10.5px;fill:var(--mut);letter-spacing:.05em;text-transform:uppercase}
g.node text.desc{font-size:11px;fill:var(--mut)}
g.node{cursor:pointer;transform-box:fill-box;transform-origin:center}
g.node:hover,g.node:focus{transform:scale(1.06)}
g.node.pinned rect.box{stroke-width:3.2}
g.node.parent rect.box{stroke:var(--pin-parent);stroke-width:3}
g.node.child rect.box{stroke:var(--pin-child);stroke-width:3}
/* A node can be BOTH a parent and a child of the pinned node (it feeds it and
   is fed by it). Neither relation may be silently dropped: the box keeps the
   parent hue, the kind line takes the child hue, and the underline is a
   non-colour cue so the doubled relation survives monochrome (R10). */
g.node.both rect.box{stroke:var(--pin-parent);stroke-width:3}
g.node.both text.kind{fill:var(--pin-child);font-weight:700;
  text-decoration:underline;text-decoration-thickness:1.5px}
g.node.dim{opacity:var(--dim)}
g.node.hit rect.box{stroke:var(--acc);stroke-width:3.4}
path.edge{fill:none;stroke:var(--mut);stroke-width:1.3;marker-end:url(#arrow)}
path.edge.parent{stroke:var(--pin-parent);stroke-width:2.2;marker-end:url(#arrowP)}
path.edge.child{stroke:var(--pin-child);stroke-width:2.2;marker-end:url(#arrowC)}
path.edge.dim{opacity:var(--dim)}
text.verb{font-size:10.5px;fill:var(--fg)}
rect.verbbg{fill:var(--bg);stroke:var(--bd);stroke-width:.8;rx:3}
g.elab.dim{opacity:var(--dim)}
.mapbar{position:absolute;right:8px;bottom:8px;display:flex;gap:5px;z-index:5}
.maphint{position:absolute;left:10px;bottom:9px;font-size:11.5px;color:var(--mut);z-index:5}

/* ---------- print ---------- */
@media print{
  :root{--bg:#fff;--fg:#000;--card:#fff;--bd:#999;--mut:#333;--dim:1}
  body{font-size:11pt}
  header .tools,.mapbar,.maphint{display:none}
  main{display:block;padding:0}
  section.region{break-inside:avoid;page-break-inside:avoid;margin:0 0 10px;border-color:#999}
  details.card{border-color:#999}
  details.card>.detail{display:block !important}
  g.node.dim,path.edge.dim,g.elab.dim{opacity:1}
  #svgwrap{height:auto;min-height:0;overflow:visible}
  svg{height:520px}
}
</style>
</head>

  <div class="meta" id="metaline"></div>
</header>

<main>

  <section class="region" id="map"><h2><span>3 &middot; Map</span><span class="muted" id="mapnote"></span></h2>
    <div class="body">
      <div id="svgwrap"></div>
      <div class="maphint">Drag to pan &middot; wheel to zoom &middot; click a node to pin</div>
      <div class="mapbar">
        <button id="zin" type="button" title="Zoom in">+</button>
        <button id="zout" type="button" title="Zoom out">&minus;</button>
        <button id="zfit" type="button" title="Fit">Fit</button>
      </div>
    </div>
  </section>
  <section class="region" id="story"><h2><span>4 &middot; Story</span><span class="muted">newest first</span></h2><div class="body"></div></section>
</main>

  nodes.forEach(function (n) {
    var p = pos[n.id]; if (!p) return;
    // outer <g> carries the translate; inner <g class="node"> carries the CSS
    // hover scale — a CSS transform on the same element would override the
    // presentation attribute and throw the node back to the origin.
    var outer = sv('g', { transform: 'translate(' + p.x + ',' + p.y + ')' });
    var g = sv('g', { class: 'node', 'data-id': n.id, tabindex: '0' });
    var r = sv('rect', {
      class: 'box', x: 0, y: 0, width: NW, height: NH, rx: kindShape(n.kind),
      fill: nodeFill(n.group), stroke: nodeStroke(n.group),
      'stroke-dasharray': statusDash(n.status)
    });
    g.appendChild(r);
    var lbl = sv('text', { class: 'lbl', x: 9, y: 17 });
    var name = txt(n.label, '?') + (n.status === 'unknown' && !/\?\s*$/.test(txt(n.label)) ? ' ?' : '');
    lbl.textContent = name.length > 26 ? name.slice(0, 25) + '…' : name;
    g.appendChild(lbl);
    var kd = sv('text', { class: 'kind', x: 9, y: 31 });
    kd.textContent = txt(n.kind, 'artifact') + ' · ' + txt(n.status, 'active') + (n.delta ? ' · ' + n.delta : '');
    g.appendChild(kd);
    var ds = sv('text', { class: 'desc', x: 9, y: 46 });
    var dtxt = txt(n.desc, '');
    ds.textContent = dtxt.length > 34 ? dtxt.slice(0, 33) + '…' : dtxt;
    g.appendChild(ds);
    var ttl = sv('title');
    ttl.textContent = txt(n.label) + ' — ' + txt(n.kind) + '/' + txt(n.status) + (dtxt ? '\n' + dtxt : '') + (n.link ? '\n' + n.link : '');
    g.appendChild(ttl);
    g.addEventListener('click', function (ev) { ev.stopPropagation(); pin(n.id); });
    g.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pin(n.id); } });
    outer.appendChild(g);
    gLayerNode.appendChild(outer);
    nodeG[n.id] = g;
  });

  function colOf(id) { var n = byId[id]; if (!n) return 0; for (var i = 0; i < cols.length; i++) { if (cols[i].members.indexOf(n) >= 0) return i; } return 0; }

  edges.forEach(function (e) {
    var a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
    var ca = colOf(e.from), cb = colOf(e.to), d;
    var ay = a.y + NH / 2, by = b.y + NH / 2;
    if (cb > ca) { var x1 = a.x + NW, x2 = b.x, dx = (x2 - x1) * 0.5; d = 'M' + x1 + ',' + ay + ' C' + (x1 + dx) + ',' + ay + ' ' + (x2 - dx) + ',' + by + ' ' + x2 + ',' + by; }
    else if (cb < ca) { var x3 = a.x, x4 = b.x + NW, dx2 = (x3 - x4) * 0.5; d = 'M' + x3 + ',' + ay + ' C' + (x3 - dx2) + ',' + ay + ' ' + (x4 + dx2) + ',' + by + ' ' + x4 + ',' + by; }
    else { var x5 = a.x + NW, off = 46 + Math.abs(by - ay) * 0.25; d = 'M' + x5 + ',' + ay + ' C' + (x5 + off) + ',' + ay + ' ' + (x5 + off) + ',' + by + ' ' + (b.x + NW) + ',' + by; }
    var p = sv('path', { class: 'edge', d: d, 'data-from': e.from, 'data-to': e.to });
    if (e.delta) p.setAttribute('stroke-dasharray', '6 3');
    gLayerEdge.appendChild(p);
    edgePaths.push(p);
    // verb ON the edge (R1 contiguity, R3 labeled relations) — never a legend
    var lg = sv('g', { class: 'elab', 'data-from': e.from, 'data-to': e.to });
    var bg = sv('rect', { class: 'verbbg' });
    var tv = sv('text', { class: 'verb', 'text-anchor': 'middle' });
    tv.textContent = txt(e.verb, 'RELATION?');
    lg.appendChild(bg); lg.appendChild(tv);
    gLayerLbl.appendChild(lg);
    labelGs.push({ g: lg, bg: bg, t: tv, path: p });
  });

  document.getElementById('svgwrap').appendChild(svg);

  labelGs.forEach(function (L) {
    var pt;
    try { pt = L.path.getPointAtLength(L.path.getTotalLength() / 2); } catch (err) { pt = null; }
    if (!pt) { var m = /M([-\d.]+),([-\d.]+)/.exec(L.path.getAttribute('d')) || [0, 0, 0]; pt = { x: +m[1] + 40, y: +m[2] }; }
    L.t.setAttribute('x', pt.x); L.t.setAttribute('y', pt.y + 3.5);
    var w = Math.max(24, L.t.textContent.length * 5.9 + 8);
    L.bg.setAttribute('x', pt.x - w / 2); L.bg.setAttribute('y', pt.y - 8);
    L.bg.setAttribute('width', w); L.bg.setAttribute('height', 15);
  });

  document.getElementById('mapnote').textContent = nodes.length + ' nodes · ' + edges.length + ' edges · ' + cols.length + ' groups';

  /* ---- pan + zoom ---- */
  var vx = 0, vy = 0, vz = 1;
  function applyView() { root.setAttribute('transform', 'translate(' + vx + ',' + vy + ') scale(' + vz + ')'); }
  var wrap = document.getElementById('svgwrap');
  wrap.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var f = ev.deltaY < 0 ? 1.12 : 1 / 1.12, nz = Math.min(4, Math.max(0.25, vz * f));
    var r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * W, sy = (ev.clientY - r.top) / r.height * H;
    vx = sx - (sx - vx) * (nz / vz); vy = sy - (sy - vy) * (nz / vz); vz = nz; applyView();
  }, { passive: false });
  var dragging = false, lx = 0, ly = 0;
  wrap.addEventListener('pointerdown', function (ev) { dragging = true; lx = ev.clientX; ly = ev.clientY; wrap.className = 'drag'; wrap.setPointerCapture(ev.pointerId); });
  wrap.addEventListener('pointermove', function (ev) {
    if (!dragging) return;
    var r = svg.getBoundingClientRect();
    vx += (ev.clientX - lx) * (W / r.width); vy += (ev.clientY - ly) * (H / r.height);
    lx = ev.clientX; ly = ev.clientY; applyView();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) {
    wrap.addEventListener(t, function () { dragging = false; wrap.className = ''; });
  });
  document.getElementById('zin').addEventListener('click', function () { vz = Math.min(4, vz * 1.2); applyView(); });
  document.getElementById('zout').addEventListener('click', function () { vz = Math.max(0.25, vz / 1.2); applyView(); });
  document.getElementById('zfit').addEventListener('click', function () { vx = 0; vy = 0; vz = 1; applyView(); });
  svg.addEventListener('click', function () { pin(null); });

  function centreOn(id) {
    var p = pos[id]; if (!p) return;
    vz = Math.max(vz, 1);
    vx = W / 2 - (p.x + NW / 2) * vz; vy = H / 2 - (p.y + NH / 2) * vz; applyView();
  }

  /* ---- click-to-pin: parents one hue, children another, rest dimmed ---- */
  var pinned = null;
  function pin(id) {
    pinned = (pinned === id) ? null : id;
    var par = {}, chi = {};
    if (pinned) {
      edges.forEach(function (e) { if (e.to === pinned) par[e.from] = 1; if (e.from === pinned) chi[e.to] = 1; });
    }
    Object.keys(nodeG).forEach(function (nid) {
      var g = nodeG[nid], c = 'node';
      if (pinned) {
        if (nid === pinned) c += ' pinned';
        else if (par[nid] && chi[nid]) c += ' parent child both';
        else if (par[nid]) c += ' parent';
        else if (chi[nid]) c += ' child';
        else c += ' dim';
      }
      g.setAttribute('class', c);
    });
    edgePaths.forEach(function (p) {
      var f = p.getAttribute('data-from'), t = p.getAttribute('data-to'), c = 'edge';
      if (pinned) {
        if (t === pinned) c += ' parent'; else if (f === pinned) c += ' child'; else c += ' dim';
      }
      p.setAttribute('class', c);
    });
    labelGs.forEach(function (L) {
      var f = L.g.getAttribute('data-from'), t = L.g.getAttribute('data-to');
      L.g.setAttribute('class', 'elab' + (pinned && f !== pinned && t !== pinned ? ' dim' : ''));
    });
    if (pinned) centreOn(pinned);
  }

  /* ---- search: >=2 chars, jump + highlight across all four regions ---- */
  var qEl = document.getElementById('q');
  function clearHits() {
    Array.prototype.forEach.call(document.querySelectorAll('.hit'), function (n) { n.classList.remove('hit'); });
    Object.keys(nodeG).forEach(function (nid) { nodeG[nid].classList.remove('hit'); });
  }
  function search() {
    var q = qEl.value.trim().toLowerCase();
    clearHits();
    if (q.length < 2) return;
    var first = null;
    nodes.forEach(function (n) {
      var hay = (txt(n.label) + ' ' + txt(n.desc) + ' ' + txt(n.kind) + ' ' + txt(n.group)).toLowerCase();
      if (hay.indexOf(q) >= 0 && nodeG[n.id]) { nodeG[n.id].classList.add('hit'); if (!first) first = n.id; }
    });
    Array.prototype.forEach.call(document.querySelectorAll('details.card'), function (d) {
      if (d.textContent.toLowerCase().indexOf(q) >= 0) { d.classList.add('hit'); d.open = true; }
    });
    if (first) centreOn(first);
    else {
      var h = document.querySelector('details.card.hit');
      if (h) h.scrollIntoView({ block: 'center' });
    }
  }
  qEl.addEventListener('input', search);
  document.getElementById('clr').addEventListener('click', function () { qEl.value = ''; clearHits(); });

  // Print: nothing that matters may be hidden on paper (R15). Expand every card.
  if (window.matchMedia) {
    var mq = window.matchMedia('print');
    if (mq.addEventListener) mq.addEventListener('change', function (e) { if (e.matches) openAll(); });
  }
  window.addEventListener('beforeprint', openAll);
  function openAll() { Array.prototype.forEach.call(document.querySelectorAll('details.card'), function (d) { d.open = true; }); }
})();
</script>
</body>
</html>
